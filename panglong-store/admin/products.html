<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Produk — PANG LONG STORE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div id="adminApp" class="admin hidden">
    <aside class="sidebar">
      <a href="index.html" class="logo">PANG<em>LONG</em> STORE</a>
      <nav class="side-nav">
        <button class="side-link" data-page="dashboard">📊 Dashboard</button>
        <button class="side-link active" data-page="produk">📦 Produk</button>
        <button class="side-link" data-page="pesanan">🧾 Pesanan</button>
      </nav>
      <button id="logoutBtn" class="side-link">🚪 Keluar</button>
    </aside>
    <main class="admin-main">
      <section id="adminProducts" class="admin-page">
        <div class="admin-head">
          <h2>Manajemen Produk</h2>
          <button class="btn" id="openProductModal">+ Tambah Produk</button>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>Produk</th><th>Harga</th><th>Stock</th><th>Aksi</th></tr></thead>
            <tbody id="productsTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <div id="productModalBox" class="modal-overlay hidden">
    <div class="modal modal-sm">
      <button class="modal-close" id="productModalBoxClose">×</button>
      <h3 id="productModalTitle">Tambah Produk</h3>
      <form id="productForm" class="form">
        <input id="pfName" required placeholder="Nama Produk">
        <div class="form-row">
          <input id="pfPrice" required type="number" min="0" placeholder="Harga (Rp)">
          <input id="pfStock" required type="number" min="0" placeholder="Stock">
        </div>
        <div class="form-row">
          <select id="pfCategory"><option value="">Pilih Kategori</option></select>
          <select id="pfUnit">
            <option value="pcs">pcs</option>
            <option value="sak">sak</option>
            <option value="m3">m3</option>
            <option value="lembar">lembar</option>
            <option value="kaleng">kaleng</option>
            <option value="roll">roll</option>
          </select>
        </div>
        <div class="form-row">
          <select id="pfStatus">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
          <div>
            <label><input id="pfFeatured" type="checkbox"> Terlaris</label>
            <label><input id="pfNew" type="checkbox"> Baru</label>
          </div>
        </div>
        <input id="pfImage" required placeholder="Emoji atau URL gambar">
        <textarea id="pfDesc" rows="3" required placeholder="Deskripsi"></textarea>
        <button class="btn btn-block" type="submit">Simpan</button>
      </form>
    </div>
  </div>

  <script src="../js/admin.js"></script>
</body>
</html>
