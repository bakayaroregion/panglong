<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Produk — PANG LONG STORE</title>
  <meta name="description" content="Katalog material bangunan: semen, batu, besi, cat, pipa, tools dan perlengkapan.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-in">
      <a href="../index.html" class="logo">PANG<em>LONG</em> STORE</a>
      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="products.html" class="active">Katalog</a>
        <a href="about.html">Tentang</a>
        <a href="contact.html">Kontak</a>
      </nav>
      <div class="header-actions">
        <input id="headerSearch" class="header-search" type="search" placeholder="Cari material bangunan...">
        <button id="cartBtn" class="icon-btn" aria-label="Keranjang">🛒<span id="cartCount">0</span></button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h2 id="catalogTitle">Semua Produk</h2>
      </div>
      <div id="categoryPills" class="pills"></div>
      <div class="filters">
        <label class="filter-item">Max harga: <input id="maxPriceInput" type="number" placeholder="Rp max"></label>
        <label class="filter-item">Urutan:
          <select id="sortSelect">
            <option value="asc">Harga: Termurah</option>
            <option value="desc">Harga: Termahal</option>
          </select>
        </label>
      </div>
      <div id="catalogGrid" class="product-grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div><a href="../index.html" class="logo footer-logo">PANG<em>LONG</em> STORE</a></div>
      <div><h4>Kontak</h4><p>📞 <a href="https://wa.me/6280000000000">WhatsApp</a></p></div>
    </div>
    <div class="footer-bottom">© 2026 PANG LONG STORE. All rights reserved.</div>
  </footer>

  <script type="module" src="../js/products.js"></script>
</body>
</html>
