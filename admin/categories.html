<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Kategori — PANG LONG STORE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
  <div id="adminApp" class="admin-shell hidden">
    <aside class="admin-sidebar">
      <a href="index.html" class="logo">PANG<em>LONG</em> STORE</a>
      <nav class="side-nav">
        <button class="side-link" data-page="dashboard">📊 Dashboard</button>
        <button class="side-link" data-page="produk">📦 Produk</button>
        <button class="side-link" data-page="pesanan">🧾 Pesanan</button>
        <button class="side-link active" data-page="kategori">🗂️ Kategori</button>
      </nav>
      <button id="logoutBtn" class="side-link">🚪 Keluar</button>
    </aside>
    <main class="admin-main">
      <section id="adminCategories" class="admin-page">
        <div class="admin-head"><h2>Manajemen Kategori</h2></div>
        <div class="admin-panel"><div id="adminCategoriesList"></div></div>
        <div class="admin-panel" style="margin-top:20px">
          <h3>Tambah Kategori</h3>
          <form id="categoryForm" class="form">
            <input id="catName" required placeholder="Nama Kategori">
            <input id="catSlug" required placeholder="Slug (cth: semen-mortar)">
            <div class="form-row">
              <input id="catOrder" type="number" min="0" placeholder="Urutan Tampil">
              <input id="catIcon" placeholder="Ikon (cth: 🧱)">
            </div>
            <label style="display:flex;gap:8px;align-items:center;font-size:14px">
              <input id="catActive" type="checkbox" checked /> Aktif
            </label>
            <button class="btn" type="submit">Simpan</button>
          </form>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
