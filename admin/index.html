<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin PANG LONG STORE</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body>
<div id="adminLogin" class="admin-login">
  <div class="admin-login-card">
    <h2>Admin PANG LONG STORE</h2>
    <form id="loginForm" class="form">
      <input id="loginEmail" required placeholder="Email Admin">
      <input id="loginPassword" required type="password" placeholder="Password">
      <button class="btn btn-block" type="submit">Masuk</button>
    </form>
    <p class="login-hint">Email: admin@panglong.store</p>
  </div>
</div>

<div id="adminApp" class="admin hidden">
  <aside class="sidebar">
    <a class="logo" href="../index.html">PANG<em>LONG</em> STORE</a>
    <nav class="side-nav">
      <button class="side-link active" data-page="dashboard">📊 Dashboard</button>
      <button class="side-link" data-page="produk">📦 Produk</button>
      <button class="side-link" data-page="pesanan">🧾 Pesanan</button>
    </nav>
    <button id="logoutBtn" class="side-link">🚪 Keluar</button>
  </aside>
  <main class="admin-main">
    <section id="adminDashboard" class="admin-page">
      <h2>Dashboard</h2>
      <div class="stat-grid">
        <div class="stat-card"><span class="stat-num" id="statProducts">0</span><span class="stat-label">Produk</span></div>
        <div class="stat-card"><span class="stat-num" id="statCategories">0</span><span class="stat-label">Kategori</span></div>
        <div class="stat-card"><span class="stat-num" id="statOrders">0</span><span class="stat-label">Pesanan</span></div>
        <div class="stat-card"><span class="stat-num" id="statRevenue">Rp 0</span><span class="stat-label">Omzet</span></div>
      </div>
      <div class="admin-cols">
        <div class="admin-panel">
          <h3>Stok Menipis</h3>
          <div id="lowStockList"></div>
        </div>
        <div class="admin-panel">
          <h3>Pesanan Terbaru</h3>
          <div id="recentOrders"></div>
        </div>
      </div>
      <div class="admin-panel">
        <h3>Grafik Penjualan (7 Hari)</h3>
        <div id="salesChart"></div>
      </div>
    </section>

    <section id="adminProducts" class="admin-page hidden">
      <div class="admin-head">
        <h2>Manajemen Produk</h2>
        <button class="btn" id="openProductModal">+ Tambah Produk</button>
      </div>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Produk</th><th>Harga</th><th>Stock</th><th>Aksi</th></tr></thead>
          <tbody id="productsTableBody"></tbody>
        </table>
      </div>
    </section>

    <section id="adminOrders" class="admin-page hidden">
      <h2>Kelola Pesanan</h2>
      <div class="table-wrap">
        <table class="table">
          <thead><tr><th>Order</th><th>Tanggal</th><th>Customer</th><th>Total</th><th>Items</th><th>Status</th><th>Payment</th><th>Shipping</th></tr></thead>
          <tbody id="ordersTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<!-- Modal Produk (Create/Edit) -->
<div id="productModalBox" class="modal-overlay hidden">
  <div class="modal modal-sm">
    <button class="modal-close" id="productModalBoxClose">×</button>
    <h3 id="productModalTitle">Tambah Produk</h3>
    <form id="productForm" class="form">
      <input id="pfName" required placeholder="Nama Produk">
      <div class="form-row">
        <input id="pfPrice" required type="number" min="0" placeholder="Harga (Rp)">
        <input id="pfStock" required type="number" min="0" placeholder="Stock">
      </div>
      <div class="form-row">
        <select id="pfCategory"><option value="">Pilih Kategori</option></select>
        <select id="pfUnit">
          <option value="pcs">pcs</option>
          <option value="sak">sak</option>
          <option value="m3">m3</option>
          <option value="lembar">lembar</option>
          <option value="kaleng">kaleng</option>
          <option value="roll">roll</option>
        </select>
      </div>
      <div class="form-row">
        <select id="pfStatus">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
        <div>
          <label><input id="pfFeatured" type="checkbox"> Terlaris</label>
          <label><input id="pfNew" type="checkbox"> Baru</label>
        </div>
      </div>
      <input id="pfImage" required placeholder="Emoji atau URL gambar">
      <textarea id="pfDesc" rows="3" required placeholder="Deskripsi"></textarea>
      <button class="btn btn-block" type="submit">Simpan</button>
    </form>
  </div>
</div>

<script src="../js/admin.js"></script>
</body>
</html>
