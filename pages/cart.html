<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang — PANG LONG STORE</title>
  <meta name="description" content="Keranjang belanja PANG LONG STORE.">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-in">
      <a href="../index.html" class="logo">PANG<em>LONG</em> STORE</a>
      <nav class="main-nav">
        <a href="../index.html">Home</a>
        <a href="products.html">Katalog</a>
        <a href="about.html">Tentang</a>
        <a href="contact.html">Kontak</a>
      </nav>
      <div class="header-actions">
        <input id="headerSearch" class="header-search" type="search" placeholder="Cari material bangunan...">
        <button id="cartBtn" class="icon-btn" aria-label="Keranjang">🛒<span id="cartCount">0</span></button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h2>Keranjang Anda</h2>
      </div>
      <div id="cartPage">
        <div id="cartItems"></div>
        <div id="cartEmpty" class="empty">Keranjang kosong. Yuk belanja!</div>
        <div id="cartSummary" class="cart-summary">
          <div class="cart-total"><span>Subtotal</span><strong id="cartSubtotal">Rp 0</strong></div>
          <div class="cart-form">
            <input id="coName" placeholder="Nama Pembeli">
            <input id="coPhone" placeholder="No. HP">
            <input id="coAddress" placeholder="Alamat Pengiriman">
            <input id="coNotes" placeholder="Catatan (opsional)">
            <label class="filter-item">Ongkir: <input id="coShipping" type="number" min="0" value="0"></label>
          </div>
          <div class="cart-total"><span>Total</span><strong id="cartTotal">Rp 0</strong></div>
          <button class="btn btn-accent btn-block" id="cartCheckout">Checkout via WhatsApp</button>
          <a class="btn btn-outline btn-block" href="index.html">Lanjut Belanja</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-grid">
      <div><a href="../index.html" class="logo footer-logo">PANG<em>LONG</em> STORE</a></div>
      <div><h4>Kontak</h4><p>📞 <a href="https://wa.me/6282117728722">WhatsApp</a></p></div>
    </div>
    <div class="footer-bottom">© 2026 PANG LONG STORE. All rights reserved.</div>
  </footer>

  <script type="module" src="../js/app.js"></script>
</body>
</html>
